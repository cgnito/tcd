[project]
name = "tcd"
version = "0.1.0"
description = "A small, from-scratch constrained decoder for language models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Abdulrahmon Adebayo", email = "abdulrahmon11052008@gmail.com" }
]
keywords = [
    "constrained-decoding",
    "structured-generation",
    "json-schema",
    "regex",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.13"
dependencies = [
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[project.urls]
Repository = "https://github.com/cgnito/tcd"
Issues = "https://github.com/cgnito/tcd/issues"

[project.scripts]
tcd = "tcd:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"

[dependency-groups]
dev = [
    "jsonschema>=4.0.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
